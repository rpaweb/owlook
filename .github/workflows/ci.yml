name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ---------------------------------------------------------------------------
  # Test suite, run once per Ruby version — a compatibility matrix: the
  # same suite, confirming it passes the same way on every version the
  # collector claims to support (collector/.ruby-version pins what this
  # repo is actually developed on), not just whichever one this repo
  # happens to be developed on. No Rails-version axis (unlike jet_ui) —
  # owlook isn't a Rails engine, it watches Rails apps from outside.
  # ---------------------------------------------------------------------------
  compatibility:
    name: "Ruby ${{ matrix.ruby }} comp."
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.2 is the floor collector/Gemfile targets; 4.0 is what this
        # repo is actually developed on. 3.3/3.4 cover what's realistically
        # in between for anyone running the collector directly.
        ruby: ["3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: collector
          bundler-cache: true

      - name: Run tests
        working-directory: collector
        run: bundle exec rake test

  # ---------------------------------------------------------------------------
  # Lint — RuboCop
  # ---------------------------------------------------------------------------
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          working-directory: collector
          bundler-cache: true

      - name: Run RuboCop
        working-directory: collector
        run: bundle exec rubocop --format github

  # ---------------------------------------------------------------------------
  # Security — bundler-audit
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          working-directory: collector
          bundler-cache: true

      - name: Update advisory database
        working-directory: collector
        run: bundle exec bundler-audit update

      - name: Check for vulnerabilities
        working-directory: collector
        run: bundle exec bundler-audit check

  # ---------------------------------------------------------------------------
  # Static security analysis — Semgrep, run as the plain local CLI (`semgrep
  # scan`, not `semgrep ci`), which needs no login/account/upload. CodeQL
  # would cover the same ground but needs paid GitHub Advanced Security on
  # a private repo (confirmed against GitHub's own docs) — this doesn't,
  # verified by actually running it against this repo's real code first.
  #
  # Run via the official Docker image pinned by digest, not `pip install
  # semgrep` — a bare pip install resolves whatever the latest release
  # happens to be at the moment CI runs, no different in kind from an
  # unpinned Action tag (the exact thing every other job here is pinned
  # against). A digest is a content hash, not a mutable pointer like a tag
  # — semgrep/semgrep:1.176.1 always resolves to this same image.
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan Ruby and JavaScript
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            semgrep scan --config p/ruby --config p/javascript --config p/security-audit \
              --error --metrics=off collector/lib/ Model.js

  # ---------------------------------------------------------------------------
  # Manifest + collector smoke test — no gem to build anymore (the widget
  # schedules its own vendored collector, see README's "How it runs"), so
  # this checks the two things that actually matter for `omarchy plugin
  # add` to work: a structurally valid manifest.json at the repo root, and
  # a real end-to-end collector cycle (construction, zero-project poll,
  # state write) running clean with no crash — not just `ruby -c` syntax
  # checking, an actual invocation, same script a real install runs.
  # ---------------------------------------------------------------------------
  smoke:
    name: manifest + collector smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          working-directory: collector
          bundler-cache: true

      - name: Validate manifest.json structure
        run: |
          jq -e '.id and .entryPoints.barWidget' manifest.json > /dev/null
          test -f "$(jq -r '.entryPoints.barWidget' manifest.json)"
          echo "✓ manifest.json has an id, entryPoints.barWidget, and that file exists"

      - name: Run a real collector cycle against an empty config
        run: |
          mkdir -p /tmp/owlook-smoke
          echo "projects: []" > /tmp/owlook-smoke/config.yml
          # Zero projects means zero observations, but the state file
          # should still get written as an empty array — that's what tells
          # the widget "confirmed: nothing configured" apart from "hasn't
          # run its first cycle yet" (see Collector#flush_state and
          # Panel.qml's stateFileLoaded). Real behavior with real projects
          # is what the Minitest suite covers; this just confirms the
          # script boots, exits 0, and produces that empty-but-present file.
          OWLOOK_CONFIG=/tmp/owlook-smoke/config.yml XDG_RUNTIME_DIR=/tmp/owlook-smoke GITHUB_TOKEN=smoke-test \
            ruby collector/bin/owlook-collector
          test "$(cat /tmp/owlook-smoke/owlook.json)" = "[]"
          echo "✓ collector ran a full cycle with no crash and wrote an empty state file"
