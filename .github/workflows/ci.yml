name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ---------------------------------------------------------------------------
  # Test suite — Ruby version matrix. No Rails-version axis (unlike jet_ui) —
  # owlook isn't a Rails engine, it watches Rails apps from outside.
  # ---------------------------------------------------------------------------
  test:
    name: "Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.2 is the gemspec's declared floor; 4.0 is what this repo is
        # actually developed on. 3.3/3.4 cover what's realistically in
        # between for anyone installing the gem.
        ruby: ["3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  # ---------------------------------------------------------------------------
  # Lint — RuboCop
  # ---------------------------------------------------------------------------
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --format github

  # ---------------------------------------------------------------------------
  # Security — bundler-audit
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Update advisory database
        run: bundle exec bundler-audit update

      - name: Check for vulnerabilities
        run: bundle exec bundler-audit check

  # ---------------------------------------------------------------------------
  # Gem build + real install smoke test — not just `gem build` (which
  # wouldn't have caught the missing-executables bug we found and fixed:
  # bin/* wasn't in spec.files, no spec.executables was declared). This
  # builds the real package and installs it into an isolated GEM_HOME,
  # confirming the commands people actually run land where expected.
  # ---------------------------------------------------------------------------
  build:
    name: gem build + install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build gem
        run: gem build owlook.gemspec

      - name: Install into an isolated GEM_HOME
        run: |
          mkdir -p /tmp/owlook-smoke
          gem install --local owlook-*.gem --install-dir /tmp/owlook-smoke --no-document --ignore-dependencies

      - name: Confirm the executables actually landed
        run: |
          test -x /tmp/owlook-smoke/bin/owlook-collector
          test -x /tmp/owlook-smoke/bin/owlook-github-status
          test -x /tmp/owlook-smoke/bin/owlook-install-systemd-unit
          echo "✓ all three executables present"
